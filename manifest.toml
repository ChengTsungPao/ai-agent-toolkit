# ai-dev-env — manifest (source of truth)
#
# Four kinds of thing, one section each (in this order). `setup.py` reads this
# file; hand-edit freely, keep it valid TOML.
#
#   [guidelines]   always-on behavioural rules, marker-injected into each
#                  harness's AGENTS.md / CLAUDE.md. One table.
#                  installed by:  setup.py guidelines | wire
#
#   [[tool]]       something installed onto the system by a package manager.
#                  Has `verify` + `[tool.install]`. A `[tool.mcp]` sub-block
#                  means it is ALSO wired as an MCP server.
#                  installed by:  setup.py install   wired by:  setup.py wire
#                  updates:       manual (uv tool upgrade / npm update -g)
#                  kind = prerequisite | cli | mcp | cli+mcp | cli+skill
#
#   [[skill]]      a third-party skill pulled from git. NOT stored in this repo.
#                  Shallow-cloned fresh and copied into the harness skills dir
#                  every run — so it is latest AT INSTALL, not auto-updated after.
#                  installed by:  setup.py skills | wire
#                  (your own skills go as committed folders under skills/ instead)
#
#   [[plugin]]     a large skill/plugin ecosystem installed through the harness's
#                  own plugin mechanism, which also auto-updates it.
#                  installed by:  setup.py plugins | wire  (some are interactive)

schema_version = 2


# ═══════════════════════════════ GUIDELINES ═══════════════════════════════
# AGENTS.md is canonical (cross-harness standard); CLAUDE.md gets a one-line
# reference to it. guidelines/CLAUDE.md is a project-root template, not read by
# setup.py.
[guidelines]
canonical = "guidelines/AGENTS.md"   # full text -> ~/.claude/AGENTS.md, $CODEX_HOME/AGENTS.md


# ═════════════════════════════════ TOOLS ═════════════════════════════════

# ---- uv --------------------------------------------------------- prerequisite
# The one hard dependency. Bootstrap scripts install it; listed so report/doctor
# can see it. Every other CLI here is a `uv tool` (isolated venv).
[[tool]]
id      = "uv"
name    = "uv"
kind    = "prerequisite"
purpose = "Python toolchain + isolated tool installer. Every other CLI tool here is installed as a `uv tool`, so each gets its own venv and never collides with system Python."
verify  = "uv --version"
docs    = "https://docs.astral.sh/uv/"
[tool.install]
macos   = "curl -LsSf https://astral.sh/uv/install.sh | sh"
linux   = "curl -LsSf https://astral.sh/uv/install.sh | sh"
windows = "powershell -ExecutionPolicy Bypass -c \"irm https://astral.sh/uv/install.ps1 | iex\""
[tool.usage]
short = "uv tool install <pkg> · uv tool upgrade --all · uv run --python 3.12 script.py"

# ---- Node.js --------------------------------------------------- prerequisite
# NOT auto-installed — there is no single reliable one-liner across macOS /
# Windows / Linux, and a version manager is a personal choice. Only the
# npm-distributed MCP servers below need it (notion-mcp, chrome-devtools).
# `report` / `doctor` flag it if missing; install it yourself, then re-run
# `setup.py install`.
[[tool]]
id      = "node"
name    = "Node.js"
kind    = "prerequisite"
purpose = "JavaScript runtime + npm. Required only by the npm-distributed MCP servers here (Notion MCP, Chrome DevTools MCP), which are installed with `npm install -g`. Nothing else in this repo depends on it."
verify  = "node --version"
docs    = "docs/node.md"
[tool.usage]
short = "Install Node LTS from https://nodejs.org or a manager: macOS `brew install node` · Windows `winget install OpenJS.NodeJS.LTS` · nvm / fnm / volta. Then: setup.py install notion-mcp chrome-devtools"

# ---- Basic Memory ------------------------------------------------- cli + mcp
[[tool]]
id      = "basic-memory"
name    = "Basic Memory"
kind    = "cli+mcp"
purpose = "Private, local, human-editable knowledge memory shared across every AI harness. Notes are plain Markdown on disk (~/basic-memory), indexed in a local SQLite db with local embeddings. No cloud, no account. Review/curate changes in any editor, Obsidian, or via git."
verify  = "basic-memory --version"
docs    = "docs/basic-memory.md"
[tool.install]
default = "uv tool install basic-memory"
[tool.post_install]
default = "basic-memory config set cloud_promo_opt_out true"   # cheap + idempotent
[tool.env]
BASIC_MEMORY_NO_PROMOS = "1"   # non-secret; safe to write into harness config
[tool.mcp]
command = "basic-memory"
args    = ["mcp"]
[tool.usage]
short = "Ask the agent to \"remember\" / \"recall\" things; it calls the write_note / search_notes / build_context MCP tools. Files in ~/basic-memory/{code,knowledge,conversations,research}. CLI: status · reindex · doctor · tool search-notes."

# ---- Notion MCP -------------------------------------------------------- mcp
# The npm package only provides an MCP server (no standalone CLI use).
[[tool]]
id      = "notion-mcp"
name    = "Notion MCP"
kind    = "mcp"
purpose = "Official Notion MCP server (@notionhq/notion-mcp-server), installed globally via npm and run locally: search / read / create / update Notion pages and databases, and comments. No middleman service — the local process talks straight to api.notion.com with a token you own; scope it to only the pages/DBs you share, and it can be read-only. Your Notion data still lives in Notion's cloud (Notion is a cloud product); 'local' only means the MCP process and token stay on your machine."
verify  = "notion-mcp-server --help"
docs    = "docs/notion.md"
setup   = "1) notion.so/profile/integrations -> New integration (internal); copy the ntn_ secret (Read-content-only if you want read-only). 2) Paste it into ~/.ai-dev-env/config.toml under [env] NOTION_TOKEN, then re-run `setup.py wire <harness>`. 3) On each Notion page/DB you want reachable: top-right menu -> Connect to integration."
[tool.install]
default = "npm install -g @notionhq/notion-mcp-server"   # needs Node.js / npm
[tool.mcp]
command = "notion-mcp-server"
args    = []
[tool.mcp.env_required]
# KEY = human description -> becomes a comment in ~/.ai-dev-env/config.toml.
# Secrets: never written into harness config, only passed to the server.
NOTION_TOKEN = "Notion internal integration secret (starts ntn_). Create at https://www.notion.so/profile/integrations ; then on each page/DB you want reachable: top-right menu -> Connect to integration."
[tool.mcp.windows]
# npm's global bin is a .cmd/.ps1 shim a harness can't resolve when spawning;
# go through cmd.
command = "cmd"
args    = ["/c", "notion-mcp-server"]
[tool.usage]
short = "Ask the agent to search / read / add / update Notion content; name the page/DB or let it search. Tools: API-post-search, API-retrieve-page-markdown, API-post-page, API-patch-page, API-create-a-comment, … (DB deletion is blocked by design)."

# ---- graphify -------------------------------------------------- cli + skill
# A CLI that registers its OWN per-harness skill via `graphify install`.
[[tool]]
id      = "graphify"
name    = "graphify"
kind    = "cli+skill"
purpose = "Turns a codebase (or folder of docs/PDFs) into a queryable knowledge graph via local tree-sitter AST parsing + Leiden community detection. Produces graph.html, GRAPH_REPORT.md, graph.json. Complements Basic Memory: graphify is derived/disposable structure over code, Basic Memory is curated long-term facts."
verify  = "graphify --version"
pypi    = "graphifyy"
docs    = "docs/graphify.md"
[tool.install]
default = "uv tool install graphifyy"
[tool.usage]
short = "In a harness: /graphify .  (build graph for current repo) · graphify query \"how does X work\" · graphify extract <path>. Registers its own skill per-harness via `graphify install --platform <name>`."

# ---- CodeGraph ----------------------------------------------------- cli + mcp
# Overlaps graphify on purpose (running both while comparing them). CodeGraph is
# a live, auto-syncing MCP; graphify is a one-shot build + visual report.
[[tool]]
id      = "codegraph"
name    = "CodeGraph"
kind    = "cli+mcp"
purpose = "Pre-indexed code knowledge graph (Rust core, local SQLite/FTS5) exposed as an MCP server. Answers 'how does X reach Y', 'who calls this', 'impact of changing Z' in one tool call instead of the agent grepping. A background daemon auto-syncs the index on file changes (~0.3s). 30+ languages, 100% local, no keys. Overlaps graphify — graphify = one-shot build + graph.html/GRAPH_REPORT; codegraph = always-live MCP for call-path / impact queries while coding."
verify  = "codegraph --version"
docs    = "docs/codegraph.md"
[tool.install]
macos   = "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh"
linux   = "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh"
windows = "powershell -ExecutionPolicy Bypass -c \"irm https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.ps1 | iex\""
[tool.post_install]
default = "codegraph telemetry off"   # anonymous usage telemetry is on by default
[tool.mcp]
command = "codegraph"
args    = ["serve", "--mcp"]
[tool.mcp.windows]
command = "cmd"
args    = ["/c", "codegraph", "serve", "--mcp"]
[tool.usage]
short = "Per repo: `codegraph init` once (builds .codegraph/ — gitignore it). Then the agent uses codegraph_explore / codegraph_node / impact / callers automatically. CLI: codegraph impact <sym> · callers <sym> · explore \"...\" · daemon (stop watchers)."

# ---- Chrome DevTools MCP --------------------------------------------- mcp
[[tool]]
id      = "chrome-devtools"
name    = "Chrome DevTools MCP"
kind    = "mcp"
purpose = "Google's Chrome DevTools MCP — drive a real Chrome from the agent: navigate, click / fill forms, screenshot, read the DOM and console, run Lighthouse, record performance traces, inspect network. Launches or attaches to local Chrome; nothing leaves the machine."
verify  = "chrome-devtools-mcp --version"
[tool.install]
default = "npm install -g chrome-devtools-mcp"   # needs Node.js / npm
[tool.mcp]
command = "chrome-devtools-mcp"
args    = []
[tool.mcp.windows]
command = "cmd"
args    = ["/c", "chrome-devtools-mcp"]
[tool.usage]
short = "Ask the agent to open a page / screenshot it / check console errors / run a perf trace. Needs Chrome or Chromium (downloads a matching build on first use if none found). No token."


# ═════════════════════════════════ SKILLS ════════════════════════════════
# Cloned fresh from `repo` each run; `paths` are the sub-dirs to copy into the
# harness skills dir. Latest at install; not auto-updated after.
[[skill]]
id    = "grill-me"
repo  = "https://github.com/mattpocock/skills"
paths = ["skills/productivity/grill-me", "skills/productivity/grilling"]


# ════════════════════════════════ PLUGINS ════════════════════════════════
# Installed through each harness's own plugin system (which also updates them).
# `#`-prefixed install commands are interactive — printed, not run.
[[plugin]]
id      = "superpowers"
purpose = "Jesse Vincent's (obra) agentic software-development methodology: 20+ composable, auto-activating skills (TDD, systematic debugging, brainstorming, git worktrees, code review) plus a bootstrap that makes the agent actually check for a relevant skill before each task."
docs    = "docs/superpowers.md"
[plugin.install]
claude-code = "claude plugin install superpowers@claude-plugins-official"
codex       = "# interactive: run `/plugins`, search 'superpowers', Install"
cursor      = "# interactive: run `/add-plugin superpowers`"
[plugin.verify]
claude-code = "claude plugin list"
